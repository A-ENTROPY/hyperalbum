# Robolectric 4.13 on Windows defaults to LEGACY sqlite (sqlite4java ships a
# ~3.9-era library with no UPSERT support), so ON CONFLICT ... DO UPDATE queries
# fail with "near \"ON\": syntax error". Force NATIVE mode so the bundled
# robolectric-nativeruntime.dll (SQLite 3.4x) is used. Production minSdk 26
# already guarantees SQLite >= 3.19; this only aligns the test environment.
sqliteMode=NATIVE
