# Project-wide Gradle settings.

# JVM
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m

# Disable Jetifier (we don't depend on legacy support libs)
android.enableJetifier=false

# Suppress warnings about non-final res IDs in libraries
android.nonFinalResIds=false

# Override the non-ASCII project path warning (project lives under H:\workspace-minimaxcode\超级相册)
android.overridePathCheck=true