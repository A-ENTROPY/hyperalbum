[versions]
agp = "8.7.3"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
compose-bom = "2025.07.00"

# Liquid Glass — Kyant0 backdrop (Apache 2.0, 2.8k stars)
backdrop = "1.0.1"
capsule = "2.1.3"

# Lucide icon set (open-source SF Symbols alternative) — used by photo viewer chrome
lucideCompose = "1.1.0"

# Media3 (ExoPlayer) for video playback
media3 = "1.5.1"

# AndroidX
core-ktx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
activity-compose = "1.9.3"
lifecycle = "2.8.7"
navigation-compose = "2.8.5"
datastore = "1.1.1"
splashscreen = "1.0.1"
work = "2.10.2"

# Coroutines
coroutines = "1.8.1"

# Media / Imaging
exifinterface = "1.3.7"
palette = "1.0.0"
glance = "1.1.0"

# Database
room = "2.7.0"

# AI / ML — Three TFLite models + MLKit Face (bundled, no GMS needed).
# NOTE: tensorflow-lite-support is intentionally NOT used because it now
# bundles litert (LiteRT) which collides with tflite:2.14.0's class names.
tflite = "2.17.0"
mnn = "1.2.2"
mlkit-face-detection = "16.0.0"
mlkit-image-labeling = "16.0.0"
onnxruntime = "1.18.0"

# Networking
okhttp = "4.12.0"
nanohttpd = "2.3.1"

# Misc
timber = "5.0.1"
coil = "2.6.0"
telephoto = "0.18.0"
biometric = "1.2.0-alpha05"
fragment = "1.8.2"

# SMB/CIFS
# NOTE: jcifs-ng latest on Maven Central is 2.1.10 (2023-10-15). No 2.2.x series exists.
jcifsng = "2.1.10"
slf4j = "2.0.16"
security-crypto = "1.0.0"

junit = "4.13.2"
androidx-test-junit = "1.2.1"
espresso = "3.6.1"
robolectric = "4.13"
androidx-test-core = "1.6.1"
truth = "1.4.2"
mockk = "1.13.10"
turbine = "1.1.0"

[libraries]
# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Media / Imaging
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-palette = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
androidx-glance = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# AI / ML — V1.0 ships the interface only. Real model binaries are vendored in V1.x.
# We declare these as optional; the build must succeed without them.
tflite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tflite" }
tflite-gpu = { group = "org.tensorflow", name = "tensorflow-lite-gpu", version.ref = "tflite" }
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkit-face-detection" }
mlkit-image-labeling = { group = "com.google.mlkit", name = "image-labeling", version.ref = "mlkit-image-labeling" }
onnxruntime = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
# MNN uses a non-standard group; V1.0 references are commented out until we vendor the .aar.
# mnn = { group = "com.alibaba.android", name = "mnn", version.ref = "mnn" }

# Networking
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }

# Logging
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# Biometric + Fragment (for Privacy vault)
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }

# Coil image loader (Compose)
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }
coil-gif = { group = "io.coil-kt", name = "coil-gif", version.ref = "coil" }

# Telephoto — ZoomableAsyncImage (Coil 2.x integration). Replaces our
# hand-rolled ZoomableImage: handles ContentScale.Fit letterbox bounds via
# the loaded bitmap's intrinsic dimensions, so pan can never drag the image
# off-screen into the empty letterbox band.
telephoto-zoomable-image-coil = { group = "me.saket.telephoto", name = "zoomable-image-coil", version.ref = "telephoto" }
# Telephoto sub-sampling-image — BitmapRegionDecoder tiled rendering for huge
# JPEG/PNG/WebP/HEIC. Lets the viewer zoom to 40× native resolution without
# loading the full bitmap into memory (region tiles decoded on demand).
telephoto-sub-sampling-image = { group = "me.saket.telephoto", name = "sub-sampling-image", version.ref = "telephoto" }

# Liquid Glass — Kyant0 backdrop + Capsule shape (Apache 2.0, 2.8k stars)
backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
capsule = { group = "io.github.kyant0", name = "capsule", version.ref = "capsule" }

# Lucide icons (composable-icons / SF Symbols alternative) for photo viewer chrome
lucideCompose = { group = "com.composables", name = "icons-lucide-android", version.ref = "lucideCompose" }

# Media3 (ExoPlayer)
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

# SMB/CIFS
jcifsng = { group = "eu.agno3.jcifs", name = "jcifs-ng", version.ref = "jcifsng" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }